<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Absen Kemensos Pro V2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Library SheetJS untuk baca & tulis Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
    .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .btn-glossy { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); transition: all 0.3s ease; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.3); }
    .btn-glossy:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-glossy:disabled { background: #334155; cursor: not-allowed; opacity: 0.7; }
    .btn-success { background: linear-gradient(135deg, #065f46 0%, #10b981 100%); transition: all 0.3s ease; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.3); }
    .btn-success:hover:not(:disabled) { transform: translateY(-2px); }
    .tab-content { display: none; animation: fadeIn 0.4s ease-in-out; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .nav-item.active { color: #3b82f6; }
    .nav-item.active .nav-indicator { display: block; }
  </style>
</head>
<body class="pb-24">

  <div class="w-full max-w-lg mx-auto mt-6 px-4">
    
    <!-- ================= TAB 1: MENU EKSTRAK OCR GAMBAR ================= -->
    <div id="menu-ocr" class="tab-content active glass-panel rounded-2xl p-6">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-white">Tahap 1: Ekstrak Gambar</h2>
        <p class="text-slate-400 text-sm mt-1">Ubah Screenshot jadi Data Excel (Template)</p>
      </div>

      <div class="w-full mb-4 mt-4">
        <label for="imgInput" class="block w-full border-2 border-dashed border-slate-500 rounded-xl p-6 text-center cursor-pointer hover:border-blue-400 hover:bg-slate-800 transition-all">
          <i class="fas fa-images text-3xl text-blue-400 mb-2"></i>
          <p class="text-slate-300 font-medium">Upload Screenshot Absen</p>
          <p class="text-slate-500 text-xs mt-1">Bisa pilih banyak gambar sekaligus</p>
        </label>
        <input type="file" id="imgInput" accept="image/*" multiple class="hidden" onchange="handleImages()">
      </div>

      <div id="imgListContainer" class="w-full mb-4 max-h-32 overflow-y-auto hidden">
        <ul id="imgList" class="space-y-2"></ul>
      </div>

      <button id="btnProcessOCR" onclick="processOCR()" disabled class="btn-glossy w-full py-4 rounded-xl font-bold text-white uppercase tracking-wide text-sm mt-2">
        <i class="fas fa-file-export mr-2"></i> Ekstrak & Download Data Excel
      </button>
    </div>

    <!-- ================= TAB 2: MENU UPLOAD EXCEL & GENERATE MANUAL ================= -->
    <div id="menu-generate" class="tab-content glass-panel rounded-2xl p-6">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-white">Tahap 2: Absen Manual</h2>
        <p class="text-slate-400 text-sm mt-1">Upload Data Excel -> Jadi Absensi Sebulan Penuh</p>
      </div>

      <!-- Pemilihan Bulan & Tahun -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Bulan</label>
          <select id="selectBulan" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 outline-none focus:border-green-400">
            <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
            <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
            <option value="7" selected>Juli</option><option value="8">Agustus</option><option value="9">September</option>
            <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Tahun</label>
          <input type="number" id="selectTahun" value="2026" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 outline-none focus:border-green-400">
        </div>
      </div>

      <!-- Upload Excel Data Mentah -->
      <div class="w-full mb-4 mt-4">
        <label for="excelInput" class="block w-full border-2 border-dashed border-slate-500 rounded-xl p-6 text-center cursor-pointer hover:border-green-400 hover:bg-slate-800 transition-all">
          <i class="fas fa-file-excel text-3xl text-green-400 mb-2"></i>
          <p class="text-slate-300 font-medium" id="excelLabel">Upload File Excel (Hasil Tahap 1)</p>
        </label>
        <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcel()">
      </div>

      <button id="btnProcessManual" onclick="processGenerateManual()" disabled class="btn-success text-white w-full py-4 rounded-xl font-bold uppercase tracking-wide text-sm mt-2">
        <i class="fas fa-calendar-check mr-2"></i> Generate Absensi Manual
      </button>
    </div>

    <!-- ================= TAB 3: PENGATURAN ================= -->
    <div id="menu-pengaturan" class="tab-content glass-panel rounded-2xl p-6">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-white">Pengaturan Identitas</h2>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Nama Lengkap</label>
          <input type="text" id="settingNama" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 outline-none">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">NIP</label>
          <input type="text" id="settingNIP" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 outline-none">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Gemini API Key</label>
          <input type="password" id="settingAPI" placeholder="AIzaSy..." class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 outline-none focus:border-blue-400">
        </div>
        <button onclick="saveSettings()" class="btn-glossy w-full py-3 mt-4 rounded-xl font-bold text-white tracking-wide text-sm">
          Simpan Pengaturan
        </button>
      </div>
    </div>

  </div>

  <!-- NAVIGASI BAWAH -->
  <nav class="fixed bottom-0 w-full glass-panel border-t border-slate-700 bg-[#0f172a]/90 z-50">
    <div class="max-w-lg mx-auto flex justify-between px-2">
      <button onclick="switchTab('menu-ocr', this)" class="nav-item active flex-1 py-4 flex flex-col items-center text-slate-400 hover:text-white relative">
        <i class="fas fa-camera text-xl mb-1"></i><span class="text-[10px] font-semibold uppercase">1. Ekstrak Gambar</span>
        <div class="nav-indicator hidden absolute top-0 w-8 h-1 bg-blue-500 rounded-b-md"></div>
      </button>
      <button onclick="switchTab('menu-generate', this)" class="nav-item flex-1 py-4 flex flex-col items-center text-slate-400 hover:text-white relative">
        <i class="fas fa-file-excel text-xl mb-1"></i><span class="text-[10px] font-semibold uppercase">2. Buat Manual</span>
        <div class="nav-indicator hidden absolute top-0 w-8 h-1 bg-green-500 rounded-b-md"></div>
      </button>
      <button onclick="switchTab('menu-pengaturan', this)" class="nav-item flex-1 py-4 flex flex-col items-center text-slate-400 hover:text-white relative">
        <i class="fas fa-user-cog text-xl mb-1"></i><span class="text-[10px] font-semibold uppercase">Pengaturan</span>
        <div class="nav-indicator hidden absolute top-0 w-8 h-1 bg-blue-500 rounded-b-md"></div>
      </button>
    </div>
  </nav>

  <script>
    let selectedImages = [];
    let uploadedExcelData = [];

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('settingNama').value = localStorage.getItem('SDM_NAMA') || 'M. Zaen Syachrullah';
      document.getElementById('settingNIP').value = localStorage.getItem('SDM_NIP') || '199006212025211050';
      document.getElementById('settingAPI').value = localStorage.getItem('GEMINI_API_KEY') || '';
    });

    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      element.classList.add('active');
    }

    function saveSettings() {
      localStorage.setItem('SDM_NAMA', document.getElementById('settingNama').value);
      localStorage.setItem('SDM_NIP', document.getElementById('settingNIP').value);
      localStorage.setItem('GEMINI_API_KEY', document.getElementById('settingAPI').value);
      Swal.fire({ icon: 'success', title: 'Tersimpan', toast: true, position: 'top', timer: 2000, showConfirmButton: false, background: '#1e293b', color: '#fff' });
    }

    // ================= TAHAP 1: HANDLE & EKSTRAK GAMBAR =================
    function handleImages() {
      const input = document.getElementById('imgInput');
      const container = document.getElementById('imgListContainer');
      const list = document.getElementById('imgList');
      const btn = document.getElementById('btnProcessOCR');

      Array.from(input.files).forEach(file => {
        if (!selectedImages.some(f => f.name === file.name)) selectedImages.push(file);
      });
      
      list.innerHTML = "";
      selectedImages.forEach((file, index) => {
        const li = document.createElement('li');
        li.className = "bg-slate-800 rounded-lg p-2 flex justify-between items-center text-xs";
        li.innerHTML = `<div class="text-slate-200 truncate w-3/4"><i class="fas fa-image text-blue-400 mr-2"></i>${file.name}</div>
                        <button onclick="removeImage(${index})" class="text-red-400"><i class="fas fa-times"></i></button>`;
        list.appendChild(li);
      });

      if (selectedImages.length > 0) {
        container.classList.remove('hidden');
        btn.disabled = false;
      } else {
        container.classList.add('hidden');
        btn.disabled = true;
      }
      input.value = ""; 
    }

    function removeImage(index) {
      selectedImages.splice(index, 1);
      handleImages();
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    async function processOCR() {
      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) return Swal.fire({ icon: 'error', title: 'API Key Kosong', text: 'Masukkan API Key di Menu Pengaturan', background: '#0f172a', color: '#fff' });

      Swal.fire({
        title: 'Mengekstrak Data...',
        html: `Memproses gambar menggunakan AI.<br><span class="text-sm text-slate-400">Harap tunggu, ini membutuhkan waktu.</span>`,
        allowOutsideClick: false, background: '#0f172a', color: '#fff',
        didOpen: () => { Swal.showLoading(); }
      });

      let extractedRecords = [];

      try {
        for (let i = 0; i < selectedImages.length; i++) {
          const base64Data = await toBase64(selectedImages[i]);
          const result = await extractFromGemini(base64Data, selectedImages[i].type, apiKey);
          extractedRecords = extractedRecords.concat(result);
        }

        // Export data mentah hasil AI ke Excel
        const worksheet = XLSX.utils.json_to_sheet(extractedRecords, { header: ["tanggal", "masuk", "pulang", "keterangan"] });
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data Mentah");
        XLSX.writeFile(workbook, "Data_Ekstrak_Gambar.xlsx");

        Swal.fire({
          icon: 'success', title: 'Tahap 1 Selesai!',
          text: 'File Excel berisi Data Mentah berhasil didownload. Lanjutkan ke Tahap 2.',
          background: '#0f172a', color: '#fff'
        }).then(() => {
          // Arahkan ke tab 2 otomatis
          switchTab('menu-generate', document.querySelectorAll('.nav-item')[1]);
        });
        
        selectedImages = [];
        handleImages();

      } catch (error) {
        console.error(error);
        Swal.fire({ icon: 'error', title: 'Gagal', text: 'Gagal mengekstrak, pastikan API Key benar dan koneksi internet stabil.', background: '#0f172a', color: '#fff' });
      }
    }

    async function extractFromGemini(base64Data, mimeType, apiKey) {
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{
          parts: [
            { text: `Ekstrak riwayat kehadiran dari gambar.
Pastikan:
1. Tanggal format DD-MM-YYYY (contoh: 30/07/2026 jadi 30-07-2026).
2. Jam Masuk dan Jam Pulang format HH:MM. Jika tidak ada isi "-".
3. Keterangan isi "Hadir".
Kembalikan HANYA JSON array: {"tanggal": "DD-MM-YYYY", "masuk": "HH:MM", "pulang": "HH:MM", "keterangan": "Hadir"}` },
            { inlineData: { mimeType: mimeType, data: base64Data } }
          ]
        }],
        generationConfig: {
          response_mime_type: "application/json",
          response_schema: {
            type: "ARRAY", items: {
              type: "OBJECT", properties: {
                tanggal: { type: "STRING" }, masuk: { type: "STRING" }, pulang: { type: "STRING" }, keterangan: { type: "STRING" }
              }
            }
          }
        }
      };

      const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!response.ok) throw new Error('API Error');
      const data = await response.json();
      if (!data.candidates) return [];
      
      const jsonString = data.candidates[0].content.parts[0].text.trim();
      return JSON.parse(jsonString);
    }

    // ================= TAHAP 2: BACA EXCEL & GENERATE MANUAL KEMENSOS =================
    function handleExcel() {
      const file = document.getElementById('excelInput').files[0];
      if (!file) return;

      document.getElementById('excelLabel').innerText = file.name;
      document.getElementById('excelLabel').classList.add('text-green-400');

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        // Convert sheet to JSON
        uploadedExcelData = XLSX.utils.sheet_to_json(worksheet);
        
        // Enable Generate Button
        document.getElementById('btnProcessManual').disabled = false;
      };
      reader.readAsArrayBuffer(file);
    }

    // Fungsi Generate Hari 1 sampai 30/31
    function getDatesInMonth(month, year) {
      let dates = [];
      let date = new Date(year, month - 1, 1);
      while (date.getMonth() === month - 1) {
        let d = String(date.getDate()).padStart(2, '0');
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let y = date.getFullYear();
        dates.push(`${d}-${m}-${y}`);
        date.setDate(date.getDate() + 1);
      }
      return dates;
    }

    function processGenerateManual() {
      if (uploadedExcelData.length === 0) {
        return Swal.fire({ icon: 'warning', title: 'Data Kosong', text: 'Mohon upload file Excel terlebih dahulu.', background: '#0f172a', color: '#fff' });
      }

      const bln = parseInt(document.getElementById('selectBulan').value);
      const thn = parseInt(document.getElementById('selectTahun').value);
      const namaPegawai = document.getElementById('settingNama').value;
      const nipPegawai = document.getElementById('settingNIP').value;

      Swal.fire({ title: 'Menyusun Absensi Manual...', allowOutsideClick: false, background: '#0f172a', color: '#fff', didOpen: () => { Swal.showLoading(); } });

      // 1. Buat Kalender 1 Bulan Penuh
      const monthDates = getDatesInMonth(bln, thn);
      let finalDataKemensos = [];

      // 2. Cocokkan Kalender dengan Data Excel yang Diupload
      monthDates.forEach((tgl, index) => {
        // Cari di data Excel yang diupload (pastikan nama kolom sesuai output json AI, huruf kecil/besar diatasi)
        let found = uploadedExcelData.find(item => {
          let itemTgl = item.tanggal || item.TANGGAL || item.Tanggal;
          return itemTgl === tgl;
        });

        let jamMasuk = "-";
        let jamPulang = "-";
        let keterangan = "-";

        if (found) {
          jamMasuk = found.masuk || found.MASUK || found.Masuk || "-";
          jamPulang = found.pulang || found.PULANG || found.Pulang || "-";
          keterangan = found.keterangan || found.KETERANGAN || found.Keterangan || "Hadir";
        }

        finalDataKemensos.push({
          "NO": index + 1,
          "NAMA": namaPegawai,
          "NIP": nipPegawai,
          "TANGGAL": tgl,
          "JAM MASUK": jamMasuk,
          "JAM PULANG": jamPulang,
          "KETERANGAN": keterangan
        });
      });

      // 3. Export ke Excel Final
      setTimeout(() => {
        const worksheet = XLSX.utils.json_to_sheet(finalDataKemensos, { 
          header: ["NO", "NAMA", "NIP", "TANGGAL", "JAM MASUK", "JAM PULANG", "KETERANGAN"]
        });
        const workbook = XLSX.utils.book_new();
        worksheet['!cols'] = [ { wch: 5 }, { wch: 30 }, { wch: 22 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 20 } ];

        let namaBulan = document.getElementById('selectBulan').options[document.getElementById('selectBulan').selectedIndex].text;
        XLSX.utils.book_append_sheet(workbook, worksheet, "Absen Manual");
        XLSX.writeFile(workbook, `Absen_Manual_Kemensos_${namaBulan}_${thn}.xlsx`);

        Swal.fire({
          icon: 'success', title: 'Berhasil!',
          text: 'File Absensi Manual Full Sebulan berhasil dibuat berdasarkan data Excel Anda.',
          background: '#0f172a', color: '#fff'
        });
      }, 1000);
    }
  </script>
</body>
</html>
