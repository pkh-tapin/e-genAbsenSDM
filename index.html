<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Ekstrak Absensi Pro - Gemini 2.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS untuk membuat file Excel persis seperti template -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .btn-glossy { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); transition: all 0.3s ease; }
    .btn-glossy:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 15px rgba(59,130,246,0.5); }
    .btn-glossy:disabled { background: #334155; cursor: not-allowed; opacity: 0.7; transform: none; box-shadow: none; }
    .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="p-4 flex flex-col items-center pb-24">

  <div class="w-full max-w-lg mt-4">
    <!-- Header -->
    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
        E-Laporan OCR AI
      </h2>
      <p class="text-slate-400 text-sm mt-2">Powered by Gemini 2.5 Flash</p>
    </div>

    <!-- TAB 1: UPLOAD GAMBAR -->
    <div id="tab-upload" class="tab-content active glass-panel rounded-2xl p-6 mb-4">
      <div class="w-full mb-4">
        <label for="imgInput" class="block w-full border-2 border-dashed border-slate-500 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 hover:bg-slate-800 transition-all">
          <i class="fas fa-cloud-upload-alt text-4xl text-blue-400 mb-3"></i>
          <p class="text-slate-300 font-medium">Klik untuk Pilih Gambar Kehadiran</p>
          <p class="text-slate-500 text-xs mt-1">(Bisa pilih banyak gambar sekaligus)</p>
        </label>
        <input type="file" id="imgInput" accept="image/*" multiple class="hidden" onchange="handleImages()">
      </div>

      <div id="imgListContainer" class="w-full mb-4 max-h-40 overflow-y-auto hidden">
        <ul id="imgList" class="space-y-2"></ul>
      </div>

      <button id="btnProcess" onclick="processAllImages()" disabled class="btn-glossy w-full py-4 rounded-xl font-bold text-white tracking-wide">
        <i class="fas fa-magic mr-2"></i> Ekstrak & Buat Template Excel
      </button>
    </div>

    <!-- TAB 2: PENGATURAN -->
    <div id="tab-pengaturan" class="tab-content glass-panel rounded-2xl p-6 mb-4">
      <h3 class="text-lg font-bold text-white mb-4"><i class="fas fa-cog mr-2"></i> Pengaturan Sistem</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">NIP (Untuk Template)</label>
          <input type="text" id="setNIP" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3" value="199006212025211050">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Token / API Key (AIza... atau AQ...)</label>
          <input type="password" id="setAPI" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3" placeholder="Masukkan token di sini">
        </div>
        <button onclick="saveSettings()" class="btn-glossy w-full py-3 rounded-xl font-bold text-white">Simpan Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- NAVIGASI BAWAH -->
  <nav class="fixed bottom-0 w-full glass-panel border-t border-slate-700 bg-[#0f172a]/95 z-50">
    <div class="max-w-lg mx-auto flex justify-between px-4">
      <button onclick="switchTab('tab-upload')" class="flex-1 py-4 flex flex-col items-center text-blue-400">
        <i class="fas fa-home text-xl mb-1"></i><span class="text-[10px] font-bold uppercase">Beranda</span>
      </button>
      <button onclick="switchTab('tab-pengaturan')" class="flex-1 py-4 flex flex-col items-center text-slate-400 hover:text-white transition">
        <i class="fas fa-sliders-h text-xl mb-1"></i><span class="text-[10px] font-bold uppercase">Pengaturan</span>
      </button>
    </div>
  </nav>

  <script>
    let selectedFiles = [];

    document.addEventListener("DOMContentLoaded", () => {
      // Load pengaturan yang tersimpan
      document.getElementById('setNIP').value = localStorage.getItem('APP_NIP') || '199006212025211050';
      document.getElementById('setAPI').value = localStorage.getItem('APP_TOKEN') || 'AQ.Ab8RN6LNd_cFcFF4szRCD0HdWiwfRrebnscLlKS_s7SQRDRYsg';
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    function saveSettings() {
      localStorage.setItem('APP_NIP', document.getElementById('setNIP').value);
      localStorage.setItem('APP_TOKEN', document.getElementById('setAPI').value);
      Swal.fire({ icon: 'success', title: 'Tersimpan', toast: true, position: 'top', timer: 2000, showConfirmButton: false, background: '#1e293b', color: '#fff' });
    }

    function handleImages() {
      const input = document.getElementById('imgInput');
      const container = document.getElementById('imgListContainer');
      const list = document.getElementById('imgList');
      const btn = document.getElementById('btnProcess');

      Array.from(input.files).forEach(file => {
        if (!selectedFiles.some(f => f.name === file.name)) selectedFiles.push(file);
      });
      
      list.innerHTML = "";
      selectedFiles.forEach((file, index) => {
        const li = document.createElement('li');
        li.className = "bg-slate-800 rounded-lg p-3 flex justify-between items-center text-sm border border-slate-700";
        li.innerHTML = `<div class="text-slate-200 truncate w-3/4"><i class="fas fa-image text-blue-400 mr-3"></i>${file.name}</div>
                        <button onclick="removeImage(${index})" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>`;
        list.appendChild(li);
      });

      if (selectedFiles.length > 0) {
        container.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-magic mr-2"></i> Ekstrak ${selectedFiles.length} Gambar`;
      } else {
        container.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-magic mr-2"></i> Ekstrak & Buat Template Excel`;
      }
      input.value = ""; 
    }

    function removeImage(index) {
      selectedFiles.splice(index, 1);
      handleImages();
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    async function processAllImages() {
      const token = document.getElementById('setAPI').value.trim();
      const nip = document.getElementById('setNIP').value.trim();

      if (!token) {
        Swal.fire({ icon: 'warning', title: 'Token Kosong', text: 'Harap isi token/API Key di menu Pengaturan.', background: '#0f172a', color: '#fff' });
        return;
      }

      Swal.fire({
        title: 'Memproses Gambar...',
        html: `Memanggil Gemini 2.5 Flash.<br><span class="text-sm text-slate-400">Harap tunggu, jangan tutup aplikasi.</span>`,
        allowOutsideClick: false, background: '#0f172a', color: '#fff',
        didOpen: () => { Swal.showLoading(); }
      });

      let allExtractedData = [];
      let successCount = 0;

      try {
        for (let i = 0; i < selectedFiles.length; i++) {
          const base64Data = await toBase64(selectedFiles[i]);
          const resultJSON = await callGemini25(base64Data, selectedFiles[i].type, token);
          
          if (resultJSON && resultJSON.length > 0) {
             const formattedRows = formatToTemplate(resultJSON, nip);
             allExtractedData = allExtractedData.concat(formattedRows);
             successCount++;
          }
        }

        if (allExtractedData.length > 0) {
          generateExcel(allExtractedData);
          Swal.fire({ icon: 'success', title: 'Sukses!', text: `Berhasil mengekstrak ${successCount} gambar menjadi Template Excel siap pakai.`, background: '#0f172a', color: '#fff' });
          selectedFiles = [];
          handleImages();
        } else {
          Swal.fire({ icon: 'error', title: 'Gagal', text: 'Tidak ada data kehadiran yang bisa dibaca dari gambar tersebut.', background: '#0f172a', color: '#fff' });
        }
      } catch (error) {
        console.error(error);
        Swal.fire({ icon: 'error', title: 'Sistem Error', text: error.message, background: '#0f172a', color: '#fff' });
      }
    }

    async function callGemini25(base64Data, mimeType, token) {
      // SISTEM PINTAR: Deteksi jenis token (API Key standar vs OAuth Token)
      let endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`;
      let headers = { 'Content-Type': 'application/json' };

      if (token.startsWith("AIza")) {
        // Jika API Key biasa, taruh di URL
        endpoint += `?key=${token}`;
      } else {
        // Jika token OAuth (seperti AQ.Ab...), taruh di Authorization Header
        headers['Authorization'] = `Bearer ${token}`;
      }

      const payload = {
        contents: [{
          parts: [
            { text: `Ekstrak riwayat kehadiran dari gambar ini.
Carilah: Tanggal, Jam Masuk, Jam Pulang, dan Jenis Kehadiran (seperti 'Bekerja di Kantor' atau 'Fleksibel').
KEMBALIKAN HANYA ARRAY JSON MURNI TANPA MARKDOWN. 
Format Wajib: [{"tanggal": "DD-MM-YYYY", "jamMasuk": "HH:MM", "jamPulang": "HH:MM", "jenis": "Bekerja di Kantor"}]` },
            { inlineData: { mimeType: mimeType || 'image/jpeg', data: base64Data } }
          ]
        }],
        generationConfig: {
          response_mime_type: "application/json",
          temperature: 0.2
        }
      };

      const response = await fetch(endpoint, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
      
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Google AI Error (${response.status}): Token mungkin kedaluwarsa atau salah format.`);
      }

      const data = await response.json();
      const jsonString = data.candidates[0].content.parts[0].text;
      return JSON.parse(jsonString);
    }

    function formatToTemplate(rawData, nip) {
      // Mengubah JSON dari AI menjadi bentuk 2 baris (Masuk & Pulang) sesuai Template Excel
      let rows = [];
      rawData.forEach(item => {
        if (item.jamMasuk && item.jamMasuk !== '-' && item.jamMasuk !== '--:--') {
          rows.push({
            "NIP": nip,
            "TANGGAL": item.tanggal,
            "KATEGORI": "Masuk",
            "JENIS": item.jenis || "Fleksibel Bekerja Secara Lokasi",
            "WAKTU": item.jamMasuk + ":00",
            "KETERANGAN": "Import dari riwayat kehadiran aplikasi"
          });
        }
        if (item.jamPulang && item.jamPulang !== '-' && item.jamPulang !== '--:--') {
          rows.push({
            "NIP": nip,
            "TANGGAL": item.tanggal,
            "KATEGORI": "Pulang",
            "JENIS": item.jenis || "Fleksibel Bekerja Secara Lokasi",
            "WAKTU": item.jamPulang + ":00",
            "KETERANGAN": "Import dari riwayat kehadiran aplikasi"
          });
        }
      });
      return rows;
    }

    function generateExcel(dataArray) {
      // Membuat worksheet Excel menggunakan library SheetJS
      const worksheet = XLSX.utils.json_to_sheet(dataArray, { 
        header: ["NIP", "TANGGAL", "KATEGORI", "JENIS", "WAKTU", "KETERANGAN"]
      });
      
      // Mengatur lebar kolom agar rapi
      worksheet['!cols'] = [ {wch: 22}, {wch: 15}, {wch: 12}, {wch: 35}, {wch: 12}, {wch: 40} ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
      
      // Download File
      XLSX.writeFile(workbook, "Template_Import_Absensi_Generated.xlsx");
    }
  </script>
</body>
</html>
